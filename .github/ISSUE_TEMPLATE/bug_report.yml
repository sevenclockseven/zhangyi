name: Bug 报告
description: 报告一个 bug
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 版本号
      description: "在「系统设置 → 关于」或 /api/health 查看"
      placeholder: "v0.10.6"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简洁描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 逐步描述如何触发这个 bug
      placeholder: |
        1. 进入凭证管理
        2. 点击新增凭证
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 凭证管理
        - 科目管理
        - 报表中心
        - 进销存管理
        - 设备管理
        - 期末处理
        - 系统设置
        - 登录/权限
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: "浏览器、操作系统、部署方式（Docker/二进制）"
      placeholder: "Chrome 120 / macOS / Docker"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 相关日志/截图
      description: 如有报错信息或截图请贴在此处
    validations:
      required: false
