name: 功能请求
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 你在什么场景下遇到了什么问题？为什么需要这个功能？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的功能行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代方案？为什么没采用？
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 凭证管理
        - 科目管理
        - 报表中心
        - 进销存管理
        - 设备管理
        - 期末处理
        - 系统设置
        - 其他
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他上下文、截图、参考链接等
    validations:
      required: false
