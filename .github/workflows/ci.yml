name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Go vet
        run: go vet ./...

      - name: Build binary
        env:
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o zhangyi .
